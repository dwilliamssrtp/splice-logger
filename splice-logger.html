<title>Splice Logger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">

<style>
:root{
  --bg:#E9EBE6; --panel:#FCFDFA; --panel-2:#F1F3EE;
  --ink:#161A16; --ink-2:#3D443C; --muted:#6B7369;
  --line:#D2D6CB; --line-strong:#B6BCAE;
  --accent:#0F6E5C; --accent-ink:#FFFFFF; --accent-soft:#D9EDE6;
  --signal:#9A4D05; --signal-soft:#F5E4CD;
  --alert:#992320; --alert-soft:#F5DBD9; --alert-ink:#FFFFFF;
  --shadow:0 1px 2px rgba(20,30,20,.07), 0 10px 28px rgba(20,30,20,.07);
  --frame:rgba(20,30,20,.10);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121510; --panel:#1B1F19; --panel-2:#232821;
    --ink:#E9ECE4; --ink-2:#C0C7BA; --muted:#939B8C;
    --line:#2C3229; --line-strong:#414937;
    --accent:#43CCA8; --accent-ink:#08201A; --accent-soft:#123029;
    --signal:#E0A055; --signal-soft:#312413;
    --alert:#E4736A; --alert-soft:#3A1F1D; --alert-ink:#2A1210;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
    --frame:rgba(255,255,255,.09);
  }
}
:root[data-theme="dark"]{
  --bg:#121510; --panel:#1B1F19; --panel-2:#232821;
  --ink:#E9ECE4; --ink-2:#C0C7BA; --muted:#939B8C;
  --line:#2C3229; --line-strong:#414937;
  --accent:#43CCA8; --accent-ink:#08201A; --accent-soft:#123029;
  --signal:#E0A055; --signal-soft:#312413;
  --alert:#E4736A; --alert-soft:#3A1F1D; --alert-ink:#2A1210;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px rgba(0,0,0,.35);
  --frame:rgba(255,255,255,.09);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Barlow","Helvetica Neue",Arial,sans-serif;
  font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.app{
  max-width:480px; margin:0 auto; min-height:100vh;
  background:var(--bg); position:relative;
  display:flex; flex-direction:column;
  border-left:1px solid var(--frame); border-right:1px solid var(--frame);
}
@media(min-width:520px){ .app{min-height:100vh} }

.topbar{
  position:sticky; top:0; z-index:30;
  background:var(--panel); border-bottom:1px solid var(--line);
  padding:10px 14px 9px;
  display:flex; align-items:center; gap:10px;
}
.brand{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.brand b{
  font-family:"Barlow Semi Condensed",sans-serif; font-weight:700;
  font-size:17px; letter-spacing:.02em; text-transform:uppercase; line-height:1;
}
.jobline{
  font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted);
  letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.statuses{display:flex;align-items:center;gap:6px;flex-shrink:0}

.pill{
  display:inline-flex;align-items:center;gap:5px;
  font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;
  font-size:12px;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 8px;border-radius:3px;border:1px solid transparent;white-space:nowrap;
}
.pill.ok{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.pill.warn{background:var(--signal-soft);color:var(--signal);border-color:var(--signal)}
.pill.bad{background:var(--alert-soft);color:var(--alert);border-color:var(--alert)}
.pill.mute{background:var(--panel-2);color:var(--muted);border-color:var(--line)}
.pill.tap{cursor:pointer}
.pill.tap:hover{filter:brightness(.97)}

.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
.dot.live{animation:pulse 1.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.dot.live{animation:none}}

main{flex:1;padding:14px 14px 96px;display:flex;flex-direction:column;gap:12px}

/* ---------- nav ---------- */
.tabbar{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:var(--panel);border-top:1px solid var(--line);
  display:flex;max-width:480px;margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom,0);
}
.tabbar button{
  flex:1;padding:10px 4px 12px;display:flex;flex-direction:column;
  align-items:center;gap:3px;color:var(--muted);
  font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;
  font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  border-top:2px solid transparent;margin-top:-1px;
}
.tabbar button[aria-current="true"]{color:var(--accent);border-top-color:var(--accent)}
.tabbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7}
.tabcount{
  font-family:"IBM Plex Mono",monospace;font-size:10px;
  background:var(--signal);color:var(--panel);border-radius:8px;
  padding:0 5px;margin-left:4px;
}

/* ---------- headings ---------- */
.eyebrow{
  font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;
  font-size:12px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);
  display:flex;align-items:center;justify-content:space-between;gap:10px;
}
h2{
  font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;
  font-size:24px;letter-spacing:.01em;margin:0;text-wrap:balance;line-height:1.1;
}
h3{
  font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;
  font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:0;
}

/* ---------- cards ---------- */
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  box-shadow:var(--shadow);overflow:hidden;
}
.card-pad{padding:13px 14px}
.rec{
  display:block;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:6px;
  padding:11px 12px 10px;display:flex;flex-direction:column;gap:7px;
  border-left:3px solid var(--line-strong);
}
.rec:hover{border-color:var(--line-strong);background:var(--panel-2)}
.rec.pending{border-left-color:var(--signal)}
.rec.synced{border-left-color:var(--accent)}
.rec-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rec-id{
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:14.5px;
  letter-spacing:-.01em;
}
.rec-type{
  font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:13.5px;
  letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);
}
.rec-meta{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--muted);
  display:flex;flex-wrap:wrap;gap:4px 12px;font-variant-numeric:tabular-nums;
}
.rec-chips{display:flex;flex-wrap:wrap;gap:5px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:48px;padding:0 18px;border-radius:5px;
  font-family:"Barlow Semi Condensed",sans-serif;font-weight:700;
  font-size:16px;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);
  transition:filter .12s ease;
}
.btn:hover{filter:brightness(.96)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--alert);border-color:var(--alert)}
.btn.destruct{background:var(--alert);color:var(--alert-ink);border-color:var(--alert)}
.btn.wide{width:100%}
.btn.sm{min-height:38px;font-size:13.5px;padding:0 12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{
  font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;
  font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
}
.field input,.field select,.field textarea{
  background:var(--bg);border:1px solid var(--line-strong);border-radius:4px;
  padding:11px 11px;min-height:46px;width:100%;
}
.field textarea{min-height:78px;resize:vertical;font-size:15px}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent);
}
.field .hint{font-size:12.5px;color:var(--muted);line-height:1.35}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.mono-in{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}

fieldset{border:none;padding:0;margin:0 0 4px}
.sect{border-top:1px solid var(--line);padding-top:13px;margin-top:4px}
.sect > h3{margin-bottom:11px;color:var(--ink-2)}

/* ---------- gps card ---------- */
.gps{border-left:3px solid var(--signal)}
.gps.locked{border-left-color:var(--accent)}
.readout{
  font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  display:grid;grid-template-columns:auto 1fr;gap:3px 14px;
  font-size:13px;margin:10px 0 12px;
}
.readout dt{color:var(--muted);letter-spacing:.02em}
.readout dd{margin:0;font-weight:500}
.bar{height:5px;background:var(--panel-2);border-radius:3px;overflow:hidden;margin:10px 0 4px}
.bar > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
@media(prefers-reduced-motion:reduce){.bar > i{transition:none}}
.acc-big{
  font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:30px;
  line-height:1;font-variant-numeric:tabular-nums;
}
.acc-big small{font-size:14px;font-weight:400;color:var(--muted);margin-left:3px}

.notice{
  border-radius:5px;padding:10px 12px;font-size:14px;line-height:1.4;
  border:1px solid;display:flex;gap:9px;align-items:flex-start;
}
.notice.warn{background:var(--signal-soft);border-color:var(--signal);color:var(--signal)}
.notice.bad{background:var(--alert-soft);border-color:var(--alert);color:var(--alert)}
.notice.ok{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.notice b{font-weight:600}
.notice svg{width:18px;height:18px;flex-shrink:0;margin-top:2px;stroke:currentColor;fill:none;stroke-width:2}

/* ---------- photos ---------- */
.shots{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.shot{
  position:relative;aspect-ratio:4/3;border-radius:5px;overflow:hidden;
  border:1px dashed var(--line-strong);background:var(--panel-2);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:8px;text-align:center;width:100%;
}
.shot.filled{border-style:solid;border-color:var(--accent);padding:0}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot .lbl{
  font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:12.5px;
  letter-spacing:.05em;text-transform:uppercase;color:var(--muted);line-height:1.15;
}
.shot svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:1.7}
.shot .x{
  position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:50%;
  background:rgba(0,0,0,.62);color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:15px;line-height:1;
}

/* ---------- plot ---------- */
.plotwrap{position:relative;background:var(--panel-2)}
canvas{display:block;width:100%;height:200px}
.plotkey{
  display:flex;gap:14px;padding:8px 12px;border-top:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);
  flex-wrap:wrap;
}
.plotkey span{display:flex;align-items:center;gap:5px}
.sw{width:9px;height:9px;border-radius:50%}

/* ---------- overlay ---------- */
.overlay{
  position:fixed;inset:0;z-index:60;background:var(--bg);
  max-width:480px;margin:0 auto;display:flex;flex-direction:column;
  border-left:1px solid var(--frame);border-right:1px solid var(--frame);
}
.ovbar{
  display:flex;align-items:center;gap:10px;padding:10px 12px;
  background:var(--panel);border-bottom:1px solid var(--line);flex-shrink:0;
}
.ovbar h2{font-size:19px;flex:1;min-width:0}
.ovbody{flex:1;overflow-y:auto;padding:13px 14px 20px;-webkit-overflow-scrolling:touch}
.ovfoot{
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));
  background:var(--panel);border-top:1px solid var(--line);
  display:flex;gap:9px;flex-shrink:0;
}
.ovfoot .btn{flex:1}

/* ---------- misc ---------- */
.empty{
  text-align:center;padding:34px 20px;color:var(--muted);
  display:flex;flex-direction:column;align-items:center;gap:10px;
}
.empty svg{width:38px;height:38px;stroke:var(--line-strong);fill:none;stroke-width:1.4}
.empty p{margin:0;font-size:14.5px;max-width:30ch;line-height:1.45}
.kv{
  display:grid;grid-template-columns:minmax(110px,auto) 1fr;gap:2px 14px;
  font-size:14px;
}
.kv dt{
  font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:12.5px;
  letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px;
}
.kv dd{margin:0 0 7px;font-family:"IBM Plex Mono",monospace;font-size:13px;word-break:break-word}
.stack{display:flex;flex-direction:column;gap:9px}
.row{display:flex;gap:9px;align-items:center}
.spread{display:flex;gap:9px;align-items:center;justify-content:space-between}
textarea.csv{
  width:100%;min-height:130px;font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  background:var(--bg);border:1px solid var(--line-strong);border-radius:4px;
  padding:9px;white-space:pre;overflow-x:auto;line-height:1.5;
}
.tagrow{
  display:flex;align-items:center;gap:10px;padding:9px 12px;
  border-bottom:1px solid var(--line);
}
.tagrow:last-child{border-bottom:none}
.tagrow input[type=checkbox]{width:21px;height:21px;accent-color:var(--accent);flex-shrink:0}
.tagrow .who{flex:1;min-width:0}
.tagrow .who b{font-family:"IBM Plex Mono",monospace;font-size:13.5px;font-weight:600;display:block}
.tagrow .who span{font-size:12.5px;color:var(--muted)}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:80;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;
  font-family:"Barlow Semi Condensed",sans-serif;font-weight:600;font-size:14px;
  letter-spacing:.04em;text-transform:uppercase;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
.tagpreview{
  border:1.5px solid var(--ink);border-radius:4px;padding:9px 11px;background:var(--panel);
  display:flex;gap:11px;align-items:center;
}
.tagpreview .qr{width:56px;height:56px;flex-shrink:0;background:var(--panel)}
.tagpreview .txt{font-family:"IBM Plex Mono",monospace;line-height:1.35;min-width:0}
.tagpreview .txt b{font-size:14px;font-weight:600;display:block;letter-spacing:-.02em}
.tagpreview .txt span{font-size:10.5px;color:var(--muted);display:block}

/* ---------- confirm dialog ---------- */
.askwrap{
  position:fixed;inset:0;z-index:90;background:rgba(10,14,10,.5);
  display:flex;align-items:center;justify-content:center;padding:22px;
}
.askbox{
  background:var(--panel);border:1px solid var(--line-strong);border-radius:7px;
  max-width:350px;width:100%;padding:16px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:13px;
}
.askbox p{margin:0;font-size:15px;line-height:1.4;color:var(--ink)}
.askbox .row{gap:9px}
.askbox .btn{flex:1}
</style>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <b>Splice Logger</b>
      <span class="jobline" id="jobline">—</span>
    </div>
    <div class="statuses" id="statuses"></div>
  </header>
  <main id="main"></main>
</div>

<nav class="tabbar" id="tabbar"></nav>
<div class="toast" id="toast"></div>
<div id="overlay-root"></div>
<div id="ask-root"></div>
<input type="file" id="restoreinput" accept="application/json,.json" hidden>

<script>
"use strict";

/* ============ constants ============ */
const KEY = "srtp-splice-log-v3";
const DUP_FT = 50;              // duplicate-guard radius
const AVG_TARGET = 12;          // readings to average per fix
const AVG_TIMEOUT = 22000;

const SPLICE_TYPES = ["Splice","Flange end"];
const PIPE_SIZES = ['2.375"','3"','3.5"','4"','4.5"','5"','5.5"','6"'];
const MATERIALS = ["Stainless steel","Zinc chromate"];
const MAX_PHOTOS = 12;

/* ============ storage ============ */
const DEFAULTS = {
  settings:{ job:"", crew:"A", tech:"" },
  records:[], seq:{}
};
let db = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const d = Object.assign({}, DEFAULTS, JSON.parse(raw));
      // photos used to be six fixed slots padded with nulls; collapse to a plain list
      (d.records || []).forEach(r => { r.photos = (r.photos || []).filter(Boolean); });
      return d;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULTS));
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(db)); }
  catch(e){ toast("Storage full — remove some photos"); }
}

/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2100);
}

function nextId(){
  const {job,crew} = db.settings;
  const k = job+"-"+crew;
  db.seq[k] = (db.seq[k]||0) + 1;
  return job+"-"+crew+"-"+String(db.seq[k]).padStart(4,"0");
}

function feetBetween(a,b){
  const R = 20902231; // earth radius, feet
  const rad = d => d*Math.PI/180;
  const dLat = rad(b.lat-a.lat), dLon = rad(b.lon-a.lon);
  const h = Math.sin(dLat/2)**2 + Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));
}
function fmtFt(ft){
  if(ft < 1000) return Math.round(ft)+" ft";
  return (ft/5280).toFixed(2)+" mi";
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" "+
         d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
}
function fmtCoord(n){ return n==null ? "—" : n.toFixed(6); }

const ICON = {
  pin:'<svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>',

/* ============ app state ============ */
let state = { tab:"log", overlay:null, draft:null, gps:null, watchId:null, here:null };

/* ============ geolocation ============ */
function startWatch(){
  if(!navigator.geolocation) return;
  if(state.watchId != null) return;
  try{
    state.watchId = navigator.geolocation.watchPosition(
      p => { state.here = {lat:p.coords.latitude, lon:p.coords.longitude, acc:p.coords.accuracy*3.28084}; renderStatuses(); },
      () => {},
      {enableHighAccuracy:true, maximumAge:5000, timeout:15000}
    );
  }catch(e){}
}

/* Average several fixes, weighting by 1/accuracy^2, dropping outliers. */
function captureFix(onTick){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation) return reject(new Error("This device has no location service."));
    const reads = [];
    let done = false, id = null, timer = null;
    const stop = () => {
      try{ if(id != null) navigator.geolocation.clearWatch(id); }catch(e){}
      if(timer != null) clearTimeout(timer);
    };
    const finish = () => {
      if(done) return; done = true;
      stop();
      if(!reads.length) return reject(new Error("No position fix yet. Move to open sky and try again."));
      const best = Math.min(...reads.map(r=>r.acc));
      const keep = reads.filter(r => r.acc <= best*3);
      let wsum=0, lat=0, lon=0;
      keep.forEach(r=>{ const w = 1/(r.acc*r.acc); wsum+=w; lat+=r.lat*w; lon+=r.lon*w; });
      resolve({
        lat: lat/wsum, lon: lon/wsum,
        acc: Math.round(best*10)/10,
        n: keep.length,
        at: new Date().toISOString(),
        source:"device"
      });
    };
    const fail = err => {
      if(done) return; done = true;
      stop();
      const code = err && err.code;
      reject(new Error(
        code === 1 ? "Location permission was denied. Allow it for this page, or enter coordinates by hand below."
        : code === 3 ? "Timed out waiting for satellites. Try again with a clear view of the sky."
        : "Location is unavailable here. Enter coordinates by hand below."
      ));
    };
    try{
      id = navigator.geolocation.watchPosition(
        p => {
          reads.push({lat:p.coords.latitude, lon:p.coords.longitude, acc:Math.max(p.coords.accuracy*3.28084, 1)});
          onTick && onTick(reads.length, Math.min(...reads.map(r=>r.acc)));
          if(reads.length >= AVG_TARGET) finish();
        },
        fail,
        {enableHighAccuracy:true, maximumAge:0, timeout:AVG_TIMEOUT}
      );
    }catch(e){ return fail(e); }
    if(!done) timer = setTimeout(finish, AVG_TIMEOUT);
  });
}

/* ============ photos ============ */
function shrink(file, max=640, q=0.6){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("Could not read that image."));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error("Could not read that image."));
      img.onload = () => {
        const s = Math.min(1, max/Math.max(img.width, img.height));
        const c = document.createElement("canvas");
        c.width = Math.round(img.width*s); c.height = Math.round(img.height*s);
        c.getContext("2d").drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL("image/jpeg", q));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function drawPlot(){
  const c = $("#plot"); if(!c) return;
  const cs = getComputedStyle(document.documentElement);
  const col = n => cs.getPropertyValue(n).trim();
  const dpr = window.devicePixelRatio || 1;
  const w = c.clientWidth, h = 200;
  c.width = w*dpr; c.height = h*dpr;
  const g = c.getContext("2d");
  g.setTransform(dpr,0,0,dpr,0,0);
  g.clearRect(0,0,w,h);

  const pts = db.records.map(r=>({lat:r.pos.lat, lon:r.pos.lon, sync:r.sync, me:false}));
  if(state.here) pts.push({lat:state.here.lat, lon:state.here.lon, me:true});
  if(!pts.length) return;

  const lat0 = pts.reduce((s,p)=>s+p.lat,0)/pts.length;
  const mPerLat = 364000, mPerLon = 364000*Math.cos(lat0*Math.PI/180); // feet per degree
  const xs = pts.map(p=>p.lon*mPerLon), ys = pts.map(p=>p.lat*mPerLat);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const spanX = Math.max(maxX-minX, 120), spanY = Math.max(maxY-minY, 120);
  const pad = 26;
  const k = Math.min((w-pad*2)/spanX, (h-pad*2)/spanY);
  const cx = (minX+maxX)/2, cy = (minY+maxY)/2;
  const X = v => w/2 + (v-cx)*k;
  const Y = v => h/2 - (v-cy)*k;

  // faint grid
  g.strokeStyle = col("--line"); g.lineWidth = 1;
  for(let i=1;i<4;i++){
    g.beginPath(); g.moveTo(0,h*i/4); g.lineTo(w,h*i/4); g.stroke();
    g.beginPath(); g.moveTo(w*i/4,0); g.lineTo(w*i/4,h); g.stroke();
  }
  // connecting run
  const line = pts.filter(p=>!p.me).sort((a,b)=>a.lon-b.lon);
  if(line.length>1){
    g.strokeStyle = col("--line-strong"); g.lineWidth = 1.5; g.setLineDash([4,4]);
    g.beginPath();
    line.forEach((p,i)=>{ const x=X(p.lon*mPerLon), y=Y(p.lat*mPerLat); i?g.lineTo(x,y):g.moveTo(x,y); });
    g.stroke(); g.setLineDash([]);
  }
  // points
  pts.forEach(p=>{
    const x = X(p.lon*mPerLon), y = Y(p.lat*mPerLat);
    if(p.me){
      g.fillStyle = col("--ink");
      g.beginPath(); g.arc(x,y,4.5,0,7); g.fill();
      g.strokeStyle = col("--ink"); g.lineWidth = 1.2;
      g.beginPath(); g.arc(x,y,10,0,7); g.stroke();
    }else{
      g.fillStyle = p.sync==="synced" ? col("--accent") : col("--signal");
      g.beginPath(); g.arc(x,y,5,0,7); g.fill();
      g.strokeStyle = col("--panel"); g.lineWidth = 1.5; g.stroke();
    }
  });
  // scale
  const target = (w-pad*2)/3;
  const raw = target/k;
  const nice = [25,50,100,250,500,1000,2500,5280].find(n=>n>=raw) || 5280;
  const sb = $("#scalebar");
  if(sb) sb.textContent = "scale ≈ " + fmtFt(nice) + " per " + Math.round(nice*k) + " px";
}

/* tiny deterministic block pattern standing in for a real QR symbol */
function drawQrStub(cv, seed){
  const g = cv.getContext("2d");
  const cs = getComputedStyle(document.documentElement);
  const N = 11, s = cv.width/N;
  let h = 0; for(let i=0;i<seed.length;i++) h = (h*31 + seed.charCodeAt(i)) >>> 0;
  g.fillStyle = cs.getPropertyValue("--panel").trim(); g.fillRect(0,0,cv.width,cv.height);
  g.fillStyle = cs.getPropertyValue("--ink").trim();
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){
    const corner = (x<3&&y<3)||(x>N-4&&y<3)||(x<3&&y>N-4);
    let on;
    if(corner){ const ex=Math.min(x,N-1-x), ey=Math.min(y,N-1-y); on = (ex===0||ey===0||(ex===2&&ey===2)||(ex>=2&&ey>=2)); }
    else { h = (h*1103515245 + 12345) >>> 0; on = ((h>>>16) & 1) === 1; }
    if(on) g.fillRect(x*s, y*s, s+0.5, s+0.5);
  }
}

/* Minimal ZIP writer (store, no compression) — enough for KMZ. */
function crc32(buf){
  let table = crc32.t;
  if(!table){
    table = crc32.t = new Uint32Array(256);
    for(let n=0;n<256;n++){
      let c = n;
      for(let k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      table[n] = c >>> 0;
    }
  }
  let crc = 0xFFFFFFFF;
  for(let i=0;i<buf.length;i++) crc = (crc >>> 8) ^ table[(crc ^ buf[i]) & 0xFF];
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

function makeZip(files, mime){
  const enc = new TextEncoder();
  const parts = [], central = [];
  let offset = 0;
  files.forEach(f => {
    const name = enc.encode(f.name);
    const crc = crc32(f.data), size = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
    lh.setUint16(6, 0, true); lh.setUint16(8, 0, true);
    lh.setUint16(10, 0, true); lh.setUint16(12, 0, true);
    lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
    lh.setUint16(26, name.length, true); lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, f.data);

    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true);
    cd.setUint16(8, 0, true); cd.setUint16(10, 0, true);
    cd.setUint16(12, 0, true); cd.setUint16(14, 0, true);
    cd.setUint32(16, crc, true); cd.setUint32(20, size, true); cd.setUint32(24, size, true);
    cd.setUint16(28, name.length, true); cd.setUint16(30, 0, true); cd.setUint16(32, 0, true);
    cd.setUint16(34, 0, true); cd.setUint16(36, 0, true); cd.setUint32(38, 0, true);
    cd.setUint32(42, offset, true);
    central.push(new Uint8Array(cd.buffer), name);
    offset += 30 + name.length + size;
  });
  let cdSize = 0; central.forEach(c => cdSize += c.length);
  const eo = new DataView(new ArrayBuffer(22));
  eo.setUint32(0, 0x06054b50, true);
  eo.setUint16(4, 0, true); eo.setUint16(6, 0, true);
  eo.setUint16(8, files.length, true); eo.setUint16(10, files.length, true);
  eo.setUint32(12, cdSize, true); eo.setUint32(16, offset, true); eo.setUint16(20, 0, true);
  return new Blob(parts.concat(central, [new Uint8Array(eo.buffer)]), {type:mime});
}

function dataUriToBytes(uri){
  const bin = atob(String(uri).split(",")[1] || "");
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}

const xml = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[c]));
const cdata = s => String(s==null?"":s).replace(/]]>/g, "]]&gt;");

function posLine(r){
  return r.pos.source==="manual"
    ? `${r.pos.lat.toFixed(6)}, ${r.pos.lon.toFixed(6)} (entered by hand)`
    : `${r.pos.lat.toFixed(6)}, ${r.pos.lon.toFixed(6)} (±${Math.round(r.pos.acc)} ft, ${r.pos.n} readings averaged)`;
}

/* KML. withPhotos=true writes relative paths that only resolve inside a KMZ. */
function buildKml(withPhotos){
  const job = db.settings.job || "Splice log";
  const marks = db.records.map(r => {
    const shots = (r.photos || []).filter(Boolean);
    const imgs = withPhotos
      ? shots.map((p,i)=>`<img src="files/${r.id}-${i+1}.jpg" width="380"/><br/>`).join("")
      : "";
    const desc =
      `<b>Type:</b> ${xml(r.type)}<br/>` +
      `<b>Pipe size:</b> ${xml(r.size)}<br/>` +
      `<b>Material:</b> ${xml(r.material || "—")}<br/>` +
      `<b>Reel:</b> ${xml(r.reel || "—")}<br/>` +
      `<b>Swage distance:</b> ${r.swage ? xml(r.swage) + " in" : "—"}<br/>` +
      (r.type === "Flange end"
        ? `<b>Flange insert depth:</b> ${r.insert ? xml(r.insert) + " in" : "—"}<br/>` : "") +
      `<b>Logged:</b> ${xml(fmtDate(r.at))}<br/>` +
      `<b>Crew:</b> ${xml(r.crew)}${r.tech ? " · " + xml(r.tech) : ""}<br/>` +
      `<b>Position:</b> ${xml(posLine(r))}<br/>` +
      (r.notes ? `<b>Notes:</b> ${xml(r.notes)}<br/>` : "") +
      (shots.length ? `<br/>${imgs}` : "");
    return `  <Placemark>
    <name>${xml(r.id)}</name>
    <styleUrl>#${r.type === "Flange end" ? "flange" : "splice"}</styleUrl>
    <TimeStamp><when>${xml(r.at)}</when></TimeStamp>
    <description><![CDATA[${cdata(desc)}]]></description>
    <Point><coordinates>${r.pos.lon.toFixed(7)},${r.pos.lat.toFixed(7)},0</coordinates></Point>
  </Placemark>`;
  }).join("\n");

  return `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>
  <name>${xml(job)}</name>
  <description>Exported ${xml(new Date().toLocaleString())} · WGS84 decimal degrees</description>
  <Style id="splice"><IconStyle><color>ff5ecc43</color><scale>1.1</scale></IconStyle></Style>
  <Style id="flange"><IconStyle><color>ff2b9ae0</color><scale>1.1</scale></IconStyle></Style>
${marks}
</Document>
</kml>`;
}

function buildCsv(){
  const head = "record_id,job,crew,technician,type,pipe_size,material,reel,swage_distance_in,flange_insert_depth_in,logged_utc,latitude,longitude,position_source,accuracy_ft,readings,photo_count,datum,notes";
  const q = s => `"${String(s==null?"":s).replace(/"/g,'""')}"`;
  const rows = db.records.map(r => [
    r.id, db.settings.job, r.crew, r.tech, r.type, r.size, r.material, r.reel,
    r.swage, r.type==="Flange end" ? r.insert : "",
    r.at, r.pos.lat.toFixed(7), r.pos.lon.toFixed(7),
    r.pos.source === "manual" ? "manual" : "device_gps",
    r.pos.source === "manual" ? "" : Math.round(r.pos.acc),
    r.pos.n, (r.photos||[]).length, "WGS84", r.notes
  ].map(q).join(","));
  return [head].concat(rows).join("\n");
}

/* Hand the file to the OS: share sheet on mobile, download everywhere else. */
async function deliver(blob, filename){
  try{
    const file = new File([blob], filename, {type:blob.type});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:filename});
      return;
    }
  }catch(err){
    if(err && err.name === "AbortError") return;   // user dismissed the share sheet
  }
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1500);
  }catch(err){ toast("Could not save the file on this browser"); }
}

function stamp(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
function baseName(){ return (db.settings.job || "splice-log").replace(/[^A-Za-z0-9._-]/g,"_"); }

async function exportKmz(){
  const enc = new TextEncoder();
  const files = [{name:"doc.kml", data:enc.encode(buildKml(true))}];
  db.records.forEach(r => {
    (r.photos || []).filter(Boolean).forEach((p,i) => {
      try{ files.push({name:`files/${r.id}-${i+1}.jpg`, data:dataUriToBytes(p)}); }catch(e){}
    });
  });
  const blob = makeZip(files, "application/vnd.google-earth.kmz");
  await deliver(blob, `${baseName()}-${stamp()}.kmz`);
}
async function exportKml(){
  await deliver(new Blob([buildKml(false)], {type:"application/vnd.google-earth.kml+xml"}),
                `${baseName()}-${stamp()}.kml`);
}
async function exportCsv(){
  await deliver(new Blob(["﻿"+buildCsv()], {type:"text/csv"}), `${baseName()}-${stamp()}.csv`);
}
async function exportBackup(){
  await deliver(new Blob([JSON.stringify(db)], {type:"application/json"}),
                `${baseName()}-backup-${stamp()}.json`);
}

  if(!t) return;

  if(t.dataset.tab){ state.tab = t.dataset.tab; render(); return; }
  if(t.dataset.open){ state.overlay = t.dataset.open; render(); return; }

  if(t.dataset.copy){
    try{ await navigator.clipboard.writeText(t.dataset.copy); toast("Copied"); }
    catch(err){ toast("Copy blocked — select it by hand"); }
    return;
  }
  if(t.dataset.copyCsv){
    const box = $("#csvbox");
    try{ await navigator.clipboard.writeText(box.value); toast("Copied"); }
    catch(err){ box.select(); toast("Select and copy"); }
    return;
  }
  if(t.dataset.applied){
    const r = db.records.find(x=>x.id===t.dataset.applied);
    if(r){ r.tagApplied = new Date().toISOString(); save(); render(); toast("Tag applied"); }
    return;
  }
  if(t.dataset.del){
    const id = t.dataset.del;
    const r = db.records.find(x=>x.id===id);
    if(r) ask(`Delete ${r.id}? This cannot be undone.`, "Delete", () => {
      db.records = db.records.filter(x=>x.id!==id);
      state.overlay = null; save(); render(); toast("Record deleted");
    });
    return;
  }
  if(t.dataset.drop != null){ state.draft.photos.splice(+t.dataset.drop, 1); render(); return; }

  const act = t.dataset.act;

  if(act==="new"){ openNew(); return; }
  if(act==="addshot"){
    const inp = $("#shotinput");
    inp.value = "";
    inp.onchange = async () => {
      const files = Array.from(inp.files || []);
      if(!files.length) return;
      let added = 0, hitCap = false;
      for(const f of files){
        if(state.draft.photos.length >= MAX_PHOTOS){ hitCap = true; break; }
        try{ state.draft.photos.push(await shrink(f)); added++; }
        catch(err){ toast(err.message); }
      }
      render();
      if(hitCap) toast(`Limit is ${MAX_PHOTOS} photos per record`);
      else if(added > 1) toast(`${added} photos added`);
    };
    inp.click();
    return;
  }
  if(act==="cancel"){
    const drop = () => { state.draft=null; state.overlay=null; state.manualOpen=false; render(); };
    if(!state.draft || !state.draft.pos) drop();
    else ask("Discard this splice? The photos and details go with it.", "Discard", drop);
    return;
  }
  if(act==="close"){ state.overlay = null; render(); return; }
  if(act==="gosetup"){ state.tab = "setup"; render(); return; }

  if(act==="kmz" || act==="kml" || act==="csv" || act==="backup"){
    t.disabled = true;
    const label = t.innerHTML;          // buttons carry an inline SVG, so keep the markup
    t.textContent = "Working…";
    try{
      if(act==="kmz") await exportKmz();
      else if(act==="kml") await exportKml();
      else if(act==="csv") await exportCsv();
      else await exportBackup();
    }catch(err){
      toast("Export failed — " + (err && err.message ? err.message : "unknown error"));
    }
    t.disabled = false; t.innerHTML = label;
    return;
  }

  if(act==="tagcsvfile"){
    const box = $("#csvbox");
    if(box) await deliver(new Blob(["﻿"+box.value], {type:"text/csv"}), `${baseName()}-tags-${stamp()}.csv`);
    return;
  }

  if(act==="restore"){
    const inp = $("#restoreinput");
    inp.value = "";
    inp.onchange = () => {
      const f = inp.files && inp.files[0]; if(!f) return;
      const fr = new FileReader();
      fr.onerror = () => toast("Could not read that file");
      fr.onload = () => {
        let parsed;
        try{ parsed = JSON.parse(fr.result); }
        catch(e){ toast("That is not a valid backup file"); return; }
        if(!parsed || !Array.isArray(parsed.records)){ toast("That file has no records in it"); return; }
        ask(`Replace everything on this device with ${parsed.records.length} record${parsed.records.length===1?"":"s"} from the backup?`,
            "Replace", () => {
          db = Object.assign({}, DEFAULTS, parsed);
          (db.records||[]).forEach(r => { r.photos = (r.photos||[]).filter(Boolean); });
          save(); render(); toast("Backup restored");
        });
      };
      fr.readAsText(f);
    };
    inp.click();
    return;
  }
  if(act==="askno"){ state.ask = null; render(); return; }
  if(act==="askyes"){
    const fn = state.ask && state.ask.onYes;
    state.ask = null;
    if(fn) fn(); else render();
    return;
  }
  if(act==="wipe"){
    ask("Erase every record on this device? This cannot be undone.", "Erase all", () => {
      db = JSON.parse(JSON.stringify(DEFAULTS)); save(); render(); toast("All records erased");
    });
    return;
  }
  if(act==="sync"){
    const q = db.records.filter(r=>r.sync==="pending");
    if(!navigator.onLine){ toast("No connection — still queued"); return; }
    toast(`Uploading ${q.length}…`);
    setTimeout(()=>{ q.forEach(r=>r.sync="synced"); save(); render(); toast("Upload complete"); }, 1100);
    return;
  }

  if(act==="fix" || act==="refix"){
    const box = $("#fixstatus");
    const btn = t; btn.disabled = true;
    if(box) box.innerHTML = `<div class="bar"><i style="width:6%"></i></div>
      <p style="margin:0 0 11px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--muted)">Acquiring…</p>`;
    try{
      const fix = await captureFix((n,best)=>{
        const b = box && box.querySelector("i");
        if(b) b.style.width = Math.round(100*n/AVG_TARGET)+"%";
        const p = box && box.querySelector("p");
        if(p) p.textContent = `${n} of ${AVG_TARGET} readings · best ±${Math.round(best)} ft`;
      });
      state.draft.pos = fix;
      state.draft.dup = nearestDup(fix);
      render();
    }catch(err){
      btn.disabled = false;
      if(box) box.innerHTML = `<div class="notice bad" style="margin-bottom:11px">${ICON.warn}<div>${esc(err.message)}</div></div>`;
    }
    return;
  }

  if(act==="manual"){ state.manualOpen = true; render(); return; }
  if(act==="manualcancel"){
    state.manualOpen = false; state.manualLat = ""; state.manualLon = "";
    render(); return;
  }
  if(act==="usemanual"){
    let latRaw = (state.manualLat||"").trim();
    let lonRaw = (state.manualLon||"").trim();
    if(latRaw.indexOf(",") > -1){                 // both pasted into the first box
      const parts = latRaw.split(",");
      latRaw = parts[0].trim();
      if(!lonRaw) lonRaw = (parts[1]||"").trim();
    }
    const lat = parseFloat(latRaw), lon = parseFloat(lonRaw);
    if(!isFinite(lat) || Math.abs(lat) > 90){ toast("Latitude must be between -90 and 90"); return; }
    if(!isFinite(lon) || Math.abs(lon) > 180){ toast("Longitude must be between -180 and 180"); return; }
    state.draft.pos = {lat, lon, acc:0, n:0, at:new Date().toISOString(), source:"manual"};
    state.draft.dup = nearestDup(state.draft.pos);
    state.manualOpen = false; state.manualLat = ""; state.manualLon = "";
    render();
    return;
  }

  if(act==="saverec"){
    const d = state.draft;
    if(!d.pos){ toast("Capture a position first"); return; }
    const rec = Object.assign({}, d, {
      id: nextId(),
      at: new Date().toISOString(),
      crew: db.settings.crew, tech: db.settings.tech,
      sync:"pending", tagPrinted:null, tagApplied:null
    });
    delete rec.dup;
    db.records.push(rec);
    save();
    state.draft = null; state.overlay = null;
    render(); toast(rec.id + " saved");
    return;
  }

  if(act==="selall"){
    const boxes = [...document.querySelectorAll(".tagpick")];
    const allOn = boxes.every(b=>b.checked);
    boxes.forEach(b=>b.checked = !allOn);
    return;
  }
  if(act==="makecsv"){
    const ids = [...document.querySelectorAll(".tagpick:checked")].map(b=>b.value);
    if(!ids.length){ toast("Pick at least one record"); return; }
    state.csvIds = ids; state.overlay = "csv"; render();
    return;
  }
  if(act==="markprinted"){
    const now = new Date().toISOString();
    db.records.filter(r=>(state.csvIds||[]).includes(r.id)).forEach(r=>r.tagPrinted = now);
    save(); state.overlay = null; state.csvIds = null; render(); toast("Marked printed");
    return;
  }
});

function nearestDup(pos){
  let best = null;
  db.records.forEach(r=>{
    const ft = feetBetween(pos, r.pos);
    if(ft <= DUP_FT && (!best || ft < best.ft)) best = {id:r.id, ft};
  });
  return best;
}

document.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.d && state.draft){ state.draft[t.dataset.d] = t.value; return; }
  if(t.dataset.m){
    if(t.dataset.m === "lat") state.manualLat = t.value; else state.manualLon = t.value;
    return;
  }
  if(t.dataset.set){
    const k = t.dataset.set, v = t.value.trim();
    db.settings[k] = (k === "crew") ? (v.toUpperCase() || "A") : v;
    save(); renderStatuses();
  }
});
document.addEventListener("change", e => {
  if(e.target.dataset.set){ render(); return; }
  // insert depth only applies to a flange end, so the form changes shape with the type
  if(e.target.dataset.d === "type"){ render(); }
});

window.addEventListener("online", renderStatuses);
window.addEventListener("offline", renderStatuses);
window.addEventListener("resize", () => { if(state.tab==="log") drawPlot(); });
if(window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => setTimeout(render, 30));

/* ============ boot ============ */
render();
startWatch();
</script>
